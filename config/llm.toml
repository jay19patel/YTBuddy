# LLM aliases. Code only ever names an alias; real model names live here.
# Each alias: primary model first, then ordered fallbacks. Providers: Google Gemini and Mistral.
# Keys come from the environment: GEMINI_API_KEY (Google AI Studio) and MISTRAL_API_KEY (La Plateforme).
# Model strings use LiteLLM's "provider/model" form: https://docs.litellm.ai/docs/providers
# The "-latest" names follow each provider's newest release, so these never go stale.
# Set LITELLM_PROXY_URL to send every alias through a LiteLLM proxy instead.

[defaults]
max_tokens = 16000
timeout_s = 180
num_retries = 2      # Router-level retries per model before falling back
allowed_fails = 3
cooldown_s = 60

[aliases.fast]       # classification, tagging, niche detection
models = ["gemini/gemini-flash-latest", "mistral/mistral-small-latest"]

[aliases.smart]      # ideas, scripts, packages
models = ["gemini/gemini-pro-latest", "mistral/mistral-large-latest"]

[aliases.long]       # full transcripts: Gemini's ~1M-token context first
models = ["gemini/gemini-pro-latest", "gemini/gemini-flash-latest"]

# USD per million tokens (paid prices). On free keys you pay nothing; the Jobs page shows what it would cost.
# Set on the high side of published prices (Nov 2026), so the budget stops early rather than late.
# Check https://ai.google.dev/gemini-api/docs/pricing and https://mistral.ai/pricing and update when they change.
[prices."gemini/gemini-pro-latest"]
input = 2.0
output = 12.0

[prices."gemini/gemini-flash-latest"]
input = 0.50
output = 3.0

[prices."mistral/mistral-large-latest"]
input = 1.36
output = 4.18

[prices."mistral/mistral-small-latest"]
input = 0.15
output = 0.60

# Token bucket per provider: requests per second and burst.
# Set for FREE tiers: Gemini's free tier allows only a few requests per minute on Pro models, Mistral's about
# 1 request per second. A 429 beyond this still falls back to the next model. Raise these on a paid key.
[rate_limits.gemini]
rate = 0.08   # about 5 per minute
burst = 2

[rate_limits.mistral]
rate = 1.0
burst = 1
