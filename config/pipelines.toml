# Which steps run, in order. Add a capability: write a Step class (ytstudio/application/steps_*.py) and
# add its name here. Remove one: delete its name. Steps declare their own queue (io / llm / media).

# Runs every day for each channel with a schedule: analysis, trends, then 2 long-video ideas and 5 Shorts ideas,
# each written out as a script (long videos also get title/thumbnail options and SEO). Everything waits for your review.
[pipelines.daily]
steps = [
  "sync_channel",          # io: incremental own-video sync
  "fetch_performance",     # io: last 90 days vs own median + retention
  "analyze_performance",   # llm: what is and isn't working
  "discover_trends",       # io: providers in parallel (chord)
  "rank_trends",           # io: outlier multiple vs each source channel's median
  "generate_ideas",        # llm: 2 long-video ideas + 5 Shorts ideas for this channel
  "develop_ideas",         # llm: one task per idea (chord). Long: hooks + script + titles + SEO. Short: one script
  "save_brief",            # io: review queue
]

# Develop one long-video idea (picked from the backlog, or typed by you) into script, package and SEO.
[pipelines.develop]
steps = ["write_script", "build_package", "write_seo", "save_brief"]

# Develop one Shorts idea into a short script with its title and description.
[pipelines.develop_short]
steps = ["write_short_script", "save_brief"]

# Upload a long video's master file on the Shorts page (or it is matched to a new upload): Shorts cut from it.
[pipelines.shorts]
steps = [
  "get_transcript",        # io: captions API
  "transcribe_fallback",   # media: faster-whisper only if no captions
  "build_chapters",        # io: chapters + dead-air edit list from the transcript
  "pick_short_candidates", # llm: 15-58 s self-contained windows, new first line
  "render_shorts",         # media: one task per Short (chord)
  "make_covers",           # media: Pillow cover per Short
  "write_short_meta",      # llm: title + description per Short
  "queue_shorts",          # io: review queue + notify
]

# Turn a script into a video: the LLM storyboards it (code windows, checklists, stickers, follow button), Chatterbox
# reads it aloud (a Hinglish script from a Devanagari copy, which its Hindi model reads naturally), then the kinetic
# typography video is drawn to the voice with sound effects, always ending on the outro.
# The thumbnail is designed by the LLM (words, boxed word, colour, sticker) and drawn in the same look.
[pipelines.script_video]
steps = ["plan_storyboard", "plan_thumbnail", "speech_text", "narrate_script", "render_script_video", "draw_thumbnail"]

# Make only the thumbnail again, with your own text or instructions if you gave them.
[pipelines.thumbnail]
steps = ["plan_thumbnail", "draw_thumbnail"]

[trends]
providers = ["most_popular", "niche_search", "custom_topics"]
