[project]
name = "ytstudio"
version = "0.1.0"
description = "Self-hosted YouTube research and content-prep agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "celery[redis]>=5.7.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "flower>=2.2.0",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.109.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlmodel>=0.0.49",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:celery.*", "ignore:Router.model_list is deprecated:DeprecationWarning"]
testpaths = ["tests"]

[project.optional-dependencies]
media = ["faster-whisper>=1.1.0", "piper-tts>=1.3.0", "edge-tts>=7.0.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "S311", "RUF001", "RUF003", "B008", "B904", "SIM105", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["ytstudio", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017", "RUF059"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["ytstudio"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]  # strict on the core (domain, use cases, ports); adapters and interfaces get stricter over time
module = ["ytstudio.domain.*", "ytstudio.application.*", "ytstudio.ports", "ytstudio.config"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["ytstudio"]
omit = ["ytstudio/cli.py"]

[tool.coverage.report]
skip_empty = true
