name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:16.10-alpine
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.8.19"}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests with coverage (domain + application must stay >= 85%)
        run: |
          uv run pytest -q --cov --cov-report=term
          uv run coverage report --include='ytstudio/domain/*,ytstudio/application/*' --fail-under=85
      - name: Dependency audit (hashed lock)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > req.txt
          uv run pip-audit -r req.txt --require-hashes --disable-pip
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Renderer typecheck
        working-directory: renderer
        run: npm ci && npx tsc --noEmit
      - name: Compose file is valid
        run: docker compose --env-file .env.example config -q
