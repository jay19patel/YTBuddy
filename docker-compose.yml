# Only "web" is published. Postgres and Redis have no host ports; Flower is on 127.0.0.1 only, with a password.
# Copy .env.example to .env and fill it in; put YTStudioCred.json next to this file.
x-app: &app
  build: .
  image: ytstudio:local
  env_file: [{path: .env, required: false}]
  environment:
    DATABASE_URL: postgresql+psycopg://ytstudio:${POSTGRES_PASSWORD}@postgres:5432/ytstudio
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    MEDIA_DIR: /app/media
    GOOGLE_CLIENT_SECRETS_FILE: /app/YTStudioCred.json
  volumes:
    - media:/app/media  # masters, Shorts, covers: shared by api and workers on this machine
    - ./YTStudioCred.json:/app/YTStudioCred.json:ro
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  stop_grace_period: 2m  # warm shutdown: running tasks finish; acks_late redelivers anything cut off

services:
  api:
    <<: *app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/postgres"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-io:
    <<: *app
    command: celery -A ytstudio.interfaces.worker worker -Q io -c 6 -n io@%h
    depends_on: {api: {condition: service_healthy}}  # api runs the migrations
    healthcheck: &workerhealth
      test: ["CMD", "python", "-m", "ytstudio.cli", "health", "worker_io"]
      interval: 2m
      timeout: 20s
      start_period: 3m

  worker-llm:
    <<: *app
    command: celery -A ytstudio.interfaces.worker worker -Q llm -c 3 -n llm@%h
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      <<: *workerhealth
      test: ["CMD", "python", "-m", "ytstudio.cli", "health", "worker_llm"]

  worker-media:
    <<: *app
    build: {context: ., args: {EXTRAS: "--extra media"}}  # faster-whisper only in this image
    image: ytstudio-media:local
    command: celery -A ytstudio.interfaces.worker worker -Q media -c 1 --prefetch-multiplier 1 -n media@%h
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      <<: *workerhealth
      test: ["CMD", "python", "-m", "ytstudio.cli", "health", "worker_media"]

  beat:  # exactly one
    <<: *app
    command: celery -A ytstudio.interfaces.worker beat -s /tmp/celerybeat-schedule
    depends_on: {api: {condition: service_healthy}}
    deploy: {replicas: 1}
    healthcheck:
      test: ["CMD", "python", "-m", "ytstudio.cli", "health", "beat"]
      interval: 5m
      timeout: 20s
      start_period: 10m

  flower:
    <<: *app
    command: celery -A ytstudio.interfaces.worker flower --port=5555 --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports: ["127.0.0.1:5555:5555"]  # never public; tunnel over SSH
    depends_on: {redis: {condition: service_healthy}}
    healthcheck: {disable: true}

  web:  # the only published service: reverse proxy in front of api (automatic HTTPS when SITE_ADDRESS is a domain)
    image: caddy:2.10.2-alpine
    command: caddy reverse-proxy --from ${SITE_ADDRESS:-:80} --to api:8000
    # Host port 8000 matches BASE_URL=http://localhost:8000 and the Google redirect URI. On a server with a
    # domain, set WEB_PORT=80 and SITE_ADDRESS=your.domain (443 is for HTTPS).
    ports: ["${WEB_PORT:-8000}:80", "443:443"]
    volumes: [caddy:/data]
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ytstudio
      POSTGRES_USER: ytstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytstudio"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      retries: 10
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    restart: unless-stopped


volumes: {pg: {}, redis: {}, media: {}, caddy: {}}
