{% extends "base.html" %}
{% block title %}YTStudio{% endblock %}
{% block content %}
<section class="login">
  <h1>YTStudio</h1>
  <p class="muted">Research and prep for your channel. Nothing is ever published for you.</p>
  {% if error %}
    <p class="err-text">{{ error }}</p>
  {% else %}
    <p class="muted">Redirecting you to Google sign-in…</p>
  {% endif %}
</section>
{% endblock %}
